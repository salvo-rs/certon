[package]
name = "certon"
version = "0.2.3"
edition = "2024"
rust-version = "1.92"
description = "Automatic HTTPS/TLS certificate management via the ACME protocol"
license = "Apache-2.0"
repository = "https://github.com/salvo-rs/certon"
keywords = ["acme", "tls", "https", "certificate", "letsencrypt"]
categories = ["network-programming", "cryptography", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Everything is on by default, so nothing changes for anybody who does not ask.
# Turning one off is how you stop paying for something you do not use: in
# compile time, in API surface, and in the dependency tree an auditor reads.
default = ["aws-lc-rs", "zerossl", "dns-01", "rsa-keys"]

# At least one cryptography provider must be chosen.
aws-lc-rs = ["dep:aws-lc-rs", "rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs", "rcgen/aws_lc_rs", "reqwest/rustls", "x509-parser/verify-aws"]
ring = ["dep:ring", "rustls/ring", "tokio-rustls/ring", "rcgen/ring", "reqwest/rustls-no-provider", "x509-parser/verify"]

# ZeroSSL as an alternative to an ACME CA, including its own REST API.
zerossl = []

# The DNS-01 challenge, which needs a resolver to watch for propagation. This
# is the one with a dependency tree behind it.
dns-01 = ["dep:hickory-resolver"]

# RSA certificate keys. Turning this off drops the `rsa` crate, which carries
# RUSTSEC-2023-0071 (the Marvin attack: a timing side channel in private-key
# operations) with no fixed version available. A deployment that only issues
# ECDSA or Ed25519 keys — which is most of them — should not have to carry an
# advisory for a code path it never reaches.
rsa-keys = ["dep:rsa"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "form"] }

# TLS
rustls = { version = "0.23.40", default-features = false, features = ["logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }

# Certificate generation and parsing
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
x509-parser = "0.18"
pem = "4"

# Crypto primitives
aws-lc-rs = { version = "1.16.3", optional = true }
ring = { version = "0.17", optional = true }
sha1 = "0.11"
sha2 = "0.11"

# Key generation and signing
p521 = { version = "0.14", features = ["ecdsa"] }
ecdsa = "0.17"
elliptic-curve = { version = "0.14", features = ["sec1"] }
signature = "3"
rsa = { version = "0.9", features = ["sha2"], optional = true }

# Encoding
base64 = "0.23"

# Async trait
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"

# Random
rand = "0.10.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# URL parsing
url = "2"

# Internationalized Domain Names
idna = "1"

# DNS resolution
hickory-resolver = { version = "0.26", optional = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

# An example that demonstrates a feature only builds when that feature is on.
[[example]]
name = "zerossl"
required-features = ["zerossl"]

[[example]]
name = "dns01_challenge"
required-features = ["dns-01"]
